services:
  db:
    image: postgres:16-alpine
    container_name: pawschedule_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pawschedule}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pawschedule}
      POSTGRES_DB: ${POSTGRES_DB:-pawschedule}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pawschedule}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pawschedule_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pawschedule}:${POSTGRES_PASSWORD:-pawschedule}@db:5432/${POSTGRES_DB:-pawschedule}
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: