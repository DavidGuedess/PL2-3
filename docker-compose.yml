services:
  db:
    image: postgres:16-alpine
    container_name: miaugenda_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miaugenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-miaugenda_dev}
      POSTGRES_DB: ${POSTGRES_DB:-miaugenda}
    ports:
      - "5432:5432"
    volumes:
      - miaugenda_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miaugenda}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: miaugenda_backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-miaugenda}:${POSTGRES_PASSWORD:-miaugenda_dev}@db:5432/${POSTGRES_DB:-miaugenda}
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  miaugenda_data:
