name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    if: ${{ hashFiles('backend/package.json') != '' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: miaugenda
          POSTGRES_PASSWORD: miaugenda
          POSTGRES_DB: miaugenda_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://miaugenda:miaugenda@localhost:5432/miaugenda_test
          JWT_SECRET: test-secret-key
          NODE_ENV: test
        run: npm test
